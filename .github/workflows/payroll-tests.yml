name: Payroll regression tests
on:
  push:
    paths:
      - "app-v7.js"
      - "research-client.mjs"
      - "research-config.mjs"
      - "research-worker/**"
      - "dashboard.mjs"
      - "payroll-trends.mjs"
      - "payroll-review.mjs"
      - "history-store.mjs"
      - "tests/**"
      - ".github/workflows/payroll-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check research Worker syntax
        run: node --check research-worker/index.mjs
      - name: Check browser module syntax
        run: node --check --input-type=module < app-v7.js
      - name: Check dashboard module syntax
        run: node --check dashboard.mjs
      - name: Check trends module syntax
        run: node --check payroll-trends.mjs
      - name: Check review module syntax
        run: node --check payroll-review.mjs
      - name: Run multi-month payroll regression tests
        run: node --test tests/*.test.mjs
