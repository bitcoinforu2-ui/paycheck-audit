name: Payroll browser six-upload smoke
on:
  push:
    paths:
      - "app-v7.js"
      - "payroll-trends.mjs"
      - "index.html"
      - "dashboard.css"
      - "dashboard.mjs"
      - "tests/payroll-browser.e2e.mjs"
      - "tests/dashboard-history.e2e.mjs"
      - "tests/dashboard-48-months.e2e.mjs"
      - "tests/dashboard-120-months.e2e.mjs"
      - "tests/payroll-120-raw.e2e.mjs"
      - "peer-comparison.mjs"
      - "tests/peer-consent.e2e.mjs"
      - ".github/workflows/payroll-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lightweight browser driver
        run: npm install --no-save playwright-core
      - name: Run six-file browser upload without private data
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_PATH" ]; then echo "Chrome not present"; exit 1; fi
          python3 -m http.server 8765 >/tmp/payroll-http.log 2>&1 &
          sleep 2
          CHROME_PATH="$CHROME_PATH" node tests/payroll-browser.e2e.mjs
          CHROME_PATH="$CHROME_PATH" node tests/dashboard-history.e2e.mjs
          CHROME_PATH="$CHROME_PATH" node tests/dashboard-48-months.e2e.mjs
          CHROME_PATH="$CHROME_PATH" node tests/dashboard-120-months.e2e.mjs
          CHROME_PATH="$CHROME_PATH" node tests/payroll-120-raw.e2e.mjs
          CHROME_PATH="$CHROME_PATH" node tests/peer-consent.e2e.mjs
      - name: Upload anonymous UI screenshots for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-qa-screens
          path: /tmp/payroll-screens/*.png
          if-no-files-found: ignore
